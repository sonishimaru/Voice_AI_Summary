# xcodegen spec for the VoiceRecorder menubar app.
#
# Usage (on a real Mac, from clients/macos/):
#   brew install xcodegen
#   xcodegen generate
#   open VoiceRecorder.xcodeproj
# See README.md for the full walkthrough (in Japanese).
name: VoiceRecorder

options:
  bundleIdPrefix: com.voiceaisummary
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  VoiceRecorder:
    type: application
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Sources/VoiceRecorder
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceaisummary.recorder
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        CODE_SIGN_ENTITLEMENTS: VoiceRecorder.entitlements
        CODE_SIGN_STYLE: Automatic
        # NOTE: xcodegen requires a development team to actually build &
        # run. Rather than hardcoding one here (which would break for
        # every other developer), leave it unset -- README.md walks
        # through picking "Personal Team" (or your own) in Xcode's
        # Signing & Capabilities tab after `xcodegen generate` / `open`.
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # No Dock icon / app menu bar -- purely a MenuBarExtra app.
        LSUIElement: true
        # Shown by macOS the first time AVAudioEngine actually opens the
        # microphone input.
        NSMicrophoneUsageDescription: "会議や通話などの音声を録音し、後で自動要約するためにマイクを使用します。"
        # Shown by macOS the first time the Core Audio process tap
        # actually starts pulling system audio (Zoom/Meet/Teams等の相手の音声、
        # 動画の音声など). This is the "system audio recording" prompt, not
        # Screen Recording -- no ScreenCaptureKit is used anywhere in this
        # app.
        NSAudioCaptureUsageDescription: "Zoom/Meet/Teamsなどで再生される相手の音声を録音し、後で自動要約するためにシステムオーディオを使用します。"
