[project]
name = "voice-ai-summary"
version = "0.1.0"
description = "Always-on voice capture → local Japanese transcription → Claude summaries → Slack/email digest"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2",
    "av>=14",
    "numpy>=1.26",
    "typer>=0.12",
    # messages.parse / output_config land in 0.73; earlier SDKs fail at the first summarize.
    "anthropic>=0.73",
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=2.2",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
vas = "voice_ai_summary.cli:main"
vas-mcp = "voice_ai_summary.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_ai_summary"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
