# Copy to ~/.config/voice-ai-summary/config.toml (or set VAS_CONFIG=/path/to/config.toml).
# Secrets (API keys, webhook URLs, SMTP passwords) are read from environment variables only.

[paths]
# Root data directory. The macOS recorder writes into <data_dir>/inbox/.
data_dir = "~/Library/Application Support/VoiceAISummary"
# Optional second copy of each daily digest. ~/Library/Application Support is off limits
# to sandboxed readers (Cowork's device tools, other agents), so point this at an ordinary
# folder to let them read the day's digest without moving the audio and database there.
# digest_mirror_dir = "~/voice-digests"

[asr]
# backend = "faster-whisper" runs on CPU (CTranslate2). On Apple Silicon, "mlx" runs on the
# GPU (pip install "voice-ai-summary[mlx]") and makes whisper-large-v3-turbo practical.
backend = "faster-whisper"
# faster-whisper: "kotoba-tech/kotoba-whisper-v2.0-faster" (Japanese-tuned, fast) or
#                 "large-v3-turbo" / "large-v3" (slower on CPU, often more accurate).
# mlx:            "mlx-community/whisper-large-v3-turbo" (default when backend = "mlx").
model = "kotoba-tech/kotoba-whisper-v2.0-faster"
device = "auto"          # auto | cpu | cuda  (faster-whisper only)
compute_type = "default" # default | int8 | float16  (faster-whisper only; int8 is ~2x faster on CPU)
language = "ja"
beam_size = 5
# Names, products and jargon that ASR keeps misspelling. Biases decoding toward these.
hotwords = []            # e.g. ["西丸", "安田さん", "チョコレート株式会社"]
initial_prompt = ""      # optional free-text context, e.g. "社内の打ち合わせの録音です。"

[vad]
threshold = 0.5           # Silero speech probability threshold (lower = more recall)
min_speech_ms = 250
min_silence_ms = 500      # gap that closes a speech region
merge_gap_ms = 2000       # regions closer than this are transcribed together (context!)
max_speech_s = 30         # split long chunks for the ASR window
pad_ms = 200              # padding added around each region

[episodes]
gap_minutes = 5           # silence longer than this starts a new episode

[llm]
# Safety cap on Claude API spend per local day, in USD (estimated from list prices).
# When today's recorded spend exceeds it, every vas command that would call the API stops.
daily_budget_usd = 2.0

[summarize]
# Per-episode extraction (map) and daily rollup (reduce).
map_model = "claude-haiku-4-5"
reduce_model = "claude-opus-5"
timezone = "Asia/Tokyo"

[correct]
# Claude-based correction pass over ASR text (homophones, proper-noun spellings) that
# runs before summarization. Uses the personal glossary below as context; corrected
# text is kept in `text` and the original in `raw_text`. See README for `vas correct`.
enabled = true
model = "claude-haiku-4-5"
batch_chars = 6000   # characters per correction call; long days are split into batches

# The personal glossary (`vas vocab ...`) can be built from your own Slack messages:
#   export VAS_SLACK_USER_TOKEN=xoxp-...    # Slack *user* token; scopes: search:read (+ channels:read,
#                                           #   groups:read, channels:history, groups:history for --scope channels)
#   vas vocab import-slack                   # your own messages
#   vas vocab import-slack --scope channels  # every channel you belong to
# (search.messages needs a user token; a bot token won't work.)

[deliver]
# Enable what you use. Secrets come from env: VAS_SLACK_WEBHOOK_URL, VAS_SMTP_PASSWORD.
slack = false
email = false
email_from = ""
email_to = ""
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_user = ""

[schedule]
digest_hour = 22          # local time for the daily digest (launchd)
digest_minute = 0
worker_poll_seconds = 30
